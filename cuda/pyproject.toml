[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "chandra-cuda"
version = "0.1.0"
description = "Optional CUDA kernels and engine for Chandra OCR"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.8"]

[project.urls]
Repository = "https://github.com/datalab-to/chandra"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/chandra_cuda"]
wheel.py-api = "cp312"
